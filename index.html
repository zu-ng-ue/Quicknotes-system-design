<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
    </header>

    <main>
        <section id="controls">
            <button id="load-btn">Load notes</button>
            <p id="status"></p>
        </section>

        <section id="create-note">
            <h2>Create a Note</h2>
            <form id="note-form">
                <label for="title-input">Title (max 100 chars)</label>
                <input type="text" id="title-input" placeholder="Enter title..." />
                
                <label for="body-input">Body (optional)</label>
                <textarea id="body-input" placeholder="Enter note body..."></textarea>
                
                <button type="submit" id="submit-btn">Create Note</button>
            </form>
        </section>

        <section id="notes-display">
            <h2>Your Notes</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes</p>
    </footer>
</body>
</html>
